name: Capture
options:
  bundleIdPrefix: com.charlesbeaumont
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
targets:
  Capture:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: "Capture"
        PRODUCT_BUNDLE_IDENTIFIER: com.charlesbeaumont.Capture
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "12"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
